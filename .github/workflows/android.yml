name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle --no-daemon assembleRelease

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk KalemNot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KalemNot-apk
          path: KalemNot.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KalemNot build ${{ github.run_number }}
          files: KalemNot.apk
          make_latest: true
